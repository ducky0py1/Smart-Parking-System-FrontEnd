<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ParkSmart 3D — EcoSmart City</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060d18;--surface:#0f1a2e;--surface2:#172035;
  --border:#1e3050;--accent:#10b981;--accent2:#06d6a0;
  --blue:#3b82f6;--green:#22c55e;--red:#ef4444;--yellow:#facc15;
  --text:#e2f0ea;--muted:#4d7a6a;--font:'Courier New',monospace;
}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;user-select:none}
canvas{display:block}

/* TOP BAR */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:100;height:58px;
  background:linear-gradient(180deg,rgba(6,13,24,0.98),rgba(6,13,24,0.82));
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;backdrop-filter:blur(16px);
}
.logo{font-size:17px;font-weight:700;letter-spacing:4px;color:#fff;display:flex;align-items:center;gap:10px}
.logo .leaf{color:var(--accent2);animation:leafspin 4s ease-in-out infinite;display:inline-block}
@keyframes leafspin{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.1)}}
.logo .brand{color:var(--accent)}
.eco-badge{font-size:9px;letter-spacing:2px;color:var(--accent2);border:1px solid var(--accent2);border-radius:3px;padding:2px 6px;opacity:0.8}
#stats{display:flex;align-items:center;gap:6px;font-size:13px;letter-spacing:1px}
#stats .num{font-size:24px;font-weight:700;color:var(--green);transition:color .5s}
#stats .sep,#stats .total{color:var(--muted)}
#stats .label{color:var(--muted);font-size:10px;margin-left:4px}

/* LEGEND */
#legend{
  position:fixed;top:70px;right:18px;z-index:100;
  background:rgba(15,26,46,0.93);border:1px solid var(--border);
  border-radius:8px;padding:14px 18px;
  display:flex;flex-direction:column;gap:8px;
  backdrop-filter:blur(10px);font-size:10px;letter-spacing:2px;
}
#legend .leg-title{color:var(--muted);margin-bottom:2px}
#legend .leg-item{display:flex;align-items:center;gap:9px}
#legend .dot{width:11px;height:11px;border-radius:2px;flex-shrink:0}

/* ECO STRIP */
#eco-strip{
  position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:90;
  background:rgba(6,214,160,0.07);border:1px solid rgba(6,214,160,0.18);
  border-radius:20px;padding:6px 20px;
  font-size:10px;letter-spacing:1.5px;color:var(--accent2);
  display:flex;gap:20px;align-items:center;backdrop-filter:blur(8px);
  transition:opacity .3s;
}
#eco-strip.hidden{opacity:0;pointer-events:none}

/* TOOLTIP */
#tooltip{
  position:fixed;z-index:200;
  background:rgba(15,26,46,0.96);border:1px solid var(--red);
  border-radius:4px;padding:6px 12px;
  font-size:11px;letter-spacing:1px;color:var(--red);
  pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;
}
#tooltip.show{opacity:1}

/* BOTTOM PANEL */
#panel{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(105%);
  z-index:200;width:min(440px,93vw);
  background:var(--surface);border:1px solid var(--border);border-bottom:none;
  border-radius:14px 14px 0 0;padding:22px 28px 30px;
  transition:transform .4s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 -16px 50px rgba(0,0,0,.6);
}
#panel.open{transform:translateX(-50%) translateY(0)}
.handle{width:36px;height:3px;background:var(--border);border-radius:2px;margin:0 auto 18px}
.spot-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.spot-id{font-size:30px;font-weight:700;letter-spacing:4px;color:#fff}
.spot-status{font-size:11px;letter-spacing:2px;color:var(--green);background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.28);border-radius:3px;padding:3px 10px}
.spot-meta{font-size:10px;color:var(--muted);letter-spacing:1px;margin-bottom:14px}
.eco-note{font-size:10px;color:var(--accent2);letter-spacing:1px;background:rgba(6,214,160,.07);border:1px solid rgba(6,214,160,.18);border-radius:4px;padding:8px 12px;margin-bottom:18px}
.btn-reserve{
  width:100%;height:48px;
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);
  border:none;border-radius:7px;color:#fff;font-family:var(--font);
  font-size:13px;letter-spacing:3px;font-weight:700;cursor:pointer;
  position:relative;overflow:hidden;transition:transform .1s;
}
.btn-reserve::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,.1);opacity:0;transition:opacity .2s}
.btn-reserve:hover::after{opacity:1}
.btn-reserve:active{transform:scale(.98)}
.btn-close{
  background:none;border:1px solid var(--border);border-radius:5px;
  color:var(--muted);font-family:var(--font);font-size:10px;letter-spacing:2px;
  padding:8px 16px;cursor:pointer;margin-top:10px;width:100%;
  transition:border-color .2s,color .2s;
}
.btn-close:hover{border-color:var(--muted);color:var(--text)}
.esc-hint{text-align:center;font-size:9px;color:var(--muted);margin-top:8px;letter-spacing:1px}

#app{cursor:default}
#app.hoverable{cursor:pointer}

#flash{position:fixed;inset:0;z-index:300;background:rgba(16,185,129,.12);pointer-events:none;opacity:0;transition:opacity .3s}
#flash.show{opacity:1}

#confirm{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.85);
  z-index:400;background:var(--surface2);border:1px solid var(--accent);
  border-radius:12px;padding:32px 44px;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;
  box-shadow:0 0 50px rgba(16,185,129,.25);
}
#confirm.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.ck-icon{font-size:38px;margin-bottom:10px}
.ck-title{font-size:15px;letter-spacing:3px;color:#fff;margin-bottom:6px}
.ck-sub{font-size:10px;color:var(--muted);letter-spacing:1px}
.ck-btn{margin-top:20px;background:var(--accent);border:none;border-radius:5px;color:#fff;font-family:var(--font);font-size:11px;letter-spacing:2px;padding:10px 28px;cursor:pointer}
</style>
</head>
<body id="app">

<div id="topbar">
  <div class="logo">
    <span class="leaf">🌿</span>PARK<span class="brand">SMART</span>&nbsp;3D
    <span class="eco-badge">ECO CITY</span>
  </div>
  <div id="stats">
    <span class="num" id="avail-count">10</span>
    <span class="sep">/</span>
    <span class="total">16</span>
    <span class="label">SPOTS AVAILABLE</span>
  </div>
</div>

<div id="legend">
  <div class="leg-title">LEGEND</div>
  <div class="leg-item"><div class="dot" style="background:#22c55e;box-shadow:0 0 6px #22c55e66"></div>AVAILABLE</div>
  <div class="leg-item"><div class="dot" style="background:#ef4444;box-shadow:0 0 6px #ef444466"></div>OCCUPIED</div>
  <div class="leg-item"><div class="dot" style="background:#facc15;box-shadow:0 0 6px #facc1566"></div>SELECTED</div>
</div>

<div id="eco-strip">
  <span>🌳 12 TREES</span>
  <span>☀️ SOLAR POWERED</span>
  <span>⚡ EV CHARGING</span>
  <span>💧 RAIN COLLECTION</span>
</div>

<div id="tooltip"></div>

<div id="panel">
  <div class="handle"></div>
  <div class="spot-row">
    <div class="spot-id" id="panel-id">A1</div>
    <div class="spot-status">AVAILABLE</div>
  </div>
  <div class="spot-meta" id="panel-meta">ROW A · SPOT 1 · LEVEL 1</div>
  <div class="eco-note" id="panel-eco">🌱 EV charging point · Solar canopy overhead</div>
  <button class="btn-reserve" id="btn-reserve">⚡ RESERVE THIS SPOT</button>
  <button class="btn-close" id="btn-close">DESELECT</button>
  <div class="esc-hint">press ESC to close</div>
</div>

<div id="flash"></div>
<div id="confirm">
  <div class="ck-icon">🌱</div>
  <div class="ck-title">RESERVATION CONFIRMED</div>
  <div class="ck-sub" id="ck-sub">SPOT A1 HAS BEEN RESERVED</div>
  <button class="ck-btn" id="ck-ok">GREAT, THANKS</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ═══════════════════════════════════════════════════════
   ParkSmart 3D — EcoSmart City Edition
   Three.js r128
═══════════════════════════════════════════════════════ */

// ─── Constants ────────────────────────────────────────
const SPOT_W = 2.5, SPOT_D = 5.0, LANE_W = 5.5;
const SPOTS   = 8;
const GAP     = 0.15;
const ROW_W   = SPOTS*(SPOT_W+GAP);
const START_X = -ROW_W/2 + SPOT_W/2;
const ROW_Z_A =  LANE_W/2 + SPOT_D/2;
const ROW_Z_B = -LANE_W/2 - SPOT_D/2;
const OCCUPIED = new Set([1,3,7,9,12,14]);

// ─── State ────────────────────────────────────────────
let selectedSpot=null, lastHover=null;
const spots=[], spotMeshMap=new Map();

// ─── Renderer ─────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1f0e);
scene.fog = new THREE.FogExp2(0x0d1f0e, 0.016);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(42,1,0.1,300);
camera.position.set(0,28,32);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.07;
controls.minDistance=10; controls.maxDistance=58;
controls.maxPolarAngle=Math.PI/2.12;
controls.target.set(0,0,0); controls.update();

// ─── Lighting ─────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xd0f0d0, 0.55));
scene.add(new THREE.HemisphereLight(0x88ccff, 0x226622, 0.5));

const sun = new THREE.DirectionalLight(0xfff5cc,1.35);
sun.position.set(-18,30,14); sun.castShadow=true;
sun.shadow.mapSize.width = sun.shadow.mapSize.height = 4096;
Object.assign(sun.shadow.camera,{near:.5,far:110,left:-32,right:32,top:26,bottom:-26});
sun.shadow.bias=-0.0004;
scene.add(sun);

const rim = new THREE.DirectionalLight(0x4488ff,0.18);
rim.position.set(16,10,-12); scene.add(rim);

// ─── Procedural Textures ──────────────────────────────
function grassTex(){
  const c=document.createElement('canvas'); c.width=c.height=512;
  const x=c.getContext('2d');
  x.fillStyle='#2a5c2a'; x.fillRect(0,0,512,512);
  const shades=['#1e5020','#2e7030','#3a8838','#224e22','#48944a','#1a4418','#5aaa5a'];
  for(let i=0;i<9000;i++){
    x.strokeStyle=shades[i%shades.length]; x.lineWidth=Math.random()*1.8+.4;
    const px=Math.random()*512,py=Math.random()*512;
    x.beginPath(); x.moveTo(px,py);
    x.lineTo(px+(Math.random()-.5)*7, py-Math.random()*14); x.stroke();
  }
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(7,7); return t;
}
function asphaltTex(tint='#1c2030'){
  const c=document.createElement('canvas'); c.width=c.height=512;
  const x=c.getContext('2d');
  x.fillStyle=tint; x.fillRect(0,0,512,512);
  for(let i=0;i<14000;i++){
    const g=Math.floor(Math.random()*38+18);
    x.fillStyle=`rgb(${g},${g},${g+4})`;
    x.beginPath(); x.arc(Math.random()*512,Math.random()*512,Math.random()*1.8+.3,0,Math.PI*2); x.fill();
  }
  for(let i=0;i<10;i++){
    x.strokeStyle='rgba(0,0,0,.25)'; x.lineWidth=.6;
    x.beginPath(); x.moveTo(Math.random()*512,Math.random()*512);
    for(let j=0;j<5;j++) x.lineTo(Math.random()*512,Math.random()*512); x.stroke();
  }
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(4,4); return t;
}
function roadTex(){
  const c=document.createElement('canvas'); c.width=512; c.height=1024;
  const x=c.getContext('2d');
  x.fillStyle='#14182a'; x.fillRect(0,0,512,1024);
  for(let i=0;i<10000;i++){
    const g=Math.floor(Math.random()*28+12);
    x.fillStyle=`rgb(${g},${g},${g})`;
    x.beginPath(); x.arc(Math.random()*512,Math.random()*1024,Math.random()*1.5+.3,0,Math.PI*2); x.fill();
  }
  // Yellow center dashes
  x.setLineDash([55,35]); x.strokeStyle='rgba(255,210,50,.7)'; x.lineWidth=5;
  x.beginPath(); x.moveTo(256,0); x.lineTo(256,1024); x.stroke();
  // White edge lines
  x.setLineDash([]); x.strokeStyle='rgba(255,255,255,.5)'; x.lineWidth=2.5;
  x.beginPath(); x.moveTo(30,0); x.lineTo(30,1024); x.stroke();
  x.beginPath(); x.moveTo(482,0); x.lineTo(482,1024); x.stroke();
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(1,2.5); return t;
}

const GT=grassTex(), AT=asphaltTex(), RT=roadTex();

// ─── Ground Layers ────────────────────────────────────
// Outer grass
const grass=new THREE.Mesh(
  new THREE.PlaneGeometry(90,90),
  new THREE.MeshStandardMaterial({map:GT,color:0x3a7a3a,roughness:.96})
);
grass.rotation.x=-Math.PI/2; grass.receiveShadow=true; scene.add(grass);

// Lot asphalt
const lot=new THREE.Mesh(
  new THREE.PlaneGeometry(40,32),
  new THREE.MeshStandardMaterial({map:AT,color:0x20263a,roughness:.9,metalness:.03})
);
lot.rotation.x=-Math.PI/2; lot.position.y=.01; lot.receiveShadow=true; scene.add(lot);

// Driving lane
const lane=new THREE.Mesh(
  new THREE.PlaneGeometry(ROW_W+.4,LANE_W),
  new THREE.MeshStandardMaterial({map:RT,color:0x18202e,roughness:.86,metalness:.05})
);
lane.rotation.x=-Math.PI/2; lane.position.y=.018; lane.receiveShadow=true; scene.add(lane);

// ─── Curbs ────────────────────────────────────────────
const CURB=new THREE.MeshStandardMaterial({color:0x7a8a98,roughness:.85,metalness:.12});
function curb(x,z,w,d,h=.15){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),CURB);
  m.position.set(x,h/2,z); m.castShadow=true; m.receiveShadow=true; scene.add(m);
}
curb(0,15.5,42,.65); curb(0,-15.5,42,.65);
curb(19.8,0,.65,30); curb(-19.8,0,.65,30);
curb(0, LANE_W/2+.1,ROW_W+.6,.18,.09);
curb(0,-LANE_W/2-.1,ROW_W+.6,.18,.09);

// ─── Grass border strips ──────────────────────────────
function grassStrip(x,z,w,d){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,.14,d),
    new THREE.MeshStandardMaterial({map:GT,color:0x3a8a3a,roughness:.95}));
  m.position.set(x,.07,z); m.receiveShadow=true; scene.add(m);
}
grassStrip(0, 12, 42, 5.5);
grassStrip(0,-12, 42, 5.5);
grassStrip( 17.5, 0, 3.5, 24);
grassStrip(-17.5, 0, 3.5, 24);

// ─── Spot helpers ─────────────────────────────────────
function spotColor(s){return s.selected?0xfacc15:s.occupied?0xef4444:0x22c55e}

function makeSpotMesh(s){
  const col=spotColor(s);
  const m=new THREE.Mesh(
    new THREE.BoxGeometry(SPOT_W-.12,.065,SPOT_D-.12),
    new THREE.MeshStandardMaterial({
      color:col,roughness:.6,metalness:.15,
      emissive:new THREE.Color(col),
      emissiveIntensity:s.occupied?.07:.22,
      transparent:true,opacity:.93
    })
  );
  m.receiveShadow=true; return m;
}

function makeLines(x,z){
  const g=new THREE.Group();
  const M=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.7,emissive:0xffffff,emissiveIntensity:.06});
  const th=.07,h=.045;
  [[-SPOT_W/2,SPOT_D],[SPOT_W/2,SPOT_D]].forEach(([lx,ld])=>{
    const m=new THREE.Mesh(new THREE.BoxGeometry(th,h,ld),M);
    m.position.set(lx,h/2,0); g.add(m);
  });
  [-SPOT_D/2,SPOT_D/2].forEach(lz=>{
    const m=new THREE.Mesh(new THREE.BoxGeometry(SPOT_W,h,th),M);
    m.position.set(0,h/2,lz); g.add(m);
  });
  g.position.set(x,.02,z); return g;
}

function refreshSpot(s){
  const col=spotColor(s);
  s.mesh.material.color.setHex(col);
  s.mesh.material.emissive.setHex(col);
  s.mesh.material.emissiveIntensity=s.selected?.45:s.occupied?.07:.22;
}

// ─── Enhanced Car ─────────────────────────────────────
const PALETTES=[
  {body:0x1a3a6e,roof:0x112854,glass:0x7ab8d4,rim:0xaaaacc},
  {body:0x7a1a1a,roof:0x5a0e0e,glass:0x8abecc,rim:0xccaaaa},
  {body:0x1a5a2a,roof:0x114020,glass:0x7ad4aa,rim:0xaaccaa},
  {body:0x4a3820,roof:0x362a16,glass:0x9abccc,rim:0xbbaa88},
  {body:0x2a1a5a,roof:0x1a0e42,glass:0x88aadd,rim:0xaaaadd},
  {body:0x555558,roof:0x3a3a3c,glass:0x9ab8cc,rim:0xbbbbbb},
  {body:0x3a1a00,roof:0x2a1200,glass:0x9ab0b8,rim:0xcc9966},
  {body:0x001a3a,roof:0x001028,glass:0x88ccee,rim:0x88aabb},
];
let cpi=0;

function makeCar(pal){
  pal=pal||PALETTES[cpi++%PALETTES.length];
  const g=new THREE.Group();
  const BM=new THREE.MeshStandardMaterial({color:pal.body,roughness:.28,metalness:.8});
  const RM=new THREE.MeshStandardMaterial({color:pal.roof,roughness:.32,metalness:.75});
  const GM=new THREE.MeshStandardMaterial({color:pal.glass,roughness:.05,metalness:.1,transparent:true,opacity:.52,emissive:pal.glass,emissiveIntensity:.06});
  const TM=new THREE.MeshStandardMaterial({color:0x111111,roughness:.95});
  const WM=new THREE.MeshStandardMaterial({color:pal.rim,roughness:.2,metalness:.92});
  const LM=new THREE.MeshStandardMaterial({color:0xffeeaa,roughness:.05,emissive:0xffeeaa,emissiveIntensity:.8,transparent:true,opacity:.95});
  const RL=new THREE.MeshStandardMaterial({color:0xff2222,roughness:.05,emissive:0xff1111,emissiveIntensity:.7,transparent:true,opacity:.9});
  const GR=new THREE.MeshStandardMaterial({color:0x1a1a22,roughness:.45,metalness:.8});
  const UN=new THREE.MeshStandardMaterial({color:0x0e0e14,roughness:.9});

  // Underbody
  mesh(g,new THREE.BoxGeometry(1.36,.1,2.62),UN,0,.1,0);
  // Lower body
  mesh(g,new THREE.BoxGeometry(1.42,.36,2.72),BM,0,.3,0,true);
  // Sills
  [-0.73,0.73].forEach(sx=>mesh(g,new THREE.BoxGeometry(.065,.12,2.6),BM,sx,.16,0));
  // Upper body shell
  mesh(g,new THREE.BoxGeometry(1.4,.2,2.7),BM,0,.5,0,true);
  // Cabin
  mesh(g,new THREE.BoxGeometry(1.14,.34,1.35),RM,0,.76,-.06,true);
  // Roof
  mesh(g,new THREE.BoxGeometry(1.08,.07,1.26),RM,0,.95,-.06);
  // Front windshield
  const wf=mesh(g,new THREE.BoxGeometry(1.06,.3,.06),GM,0,.78,.6); wf.rotation.x=-.38;
  // Rear windshield
  const wr=mesh(g,new THREE.BoxGeometry(1.02,.28,.06),GM,0,.76,-.73); wr.rotation.x=.33;
  // Side windows
  [-0.58,0.58].forEach(sx=>mesh(g,new THREE.BoxGeometry(.04,.22,1.12),GM,sx,.76,-.06));
  // Hood crease
  mesh(g,new THREE.BoxGeometry(.42,.045,.95),BM,0,.62,.9);
  // Front bumper
  mesh(g,new THREE.BoxGeometry(1.38,.24,.12),GR,0,.22,1.41);
  mesh(g,new THREE.BoxGeometry(.82,.15,.06),GR,0,.33,1.43);
  // Rear bumper
  mesh(g,new THREE.BoxGeometry(1.38,.24,.12),BM,0,.22,-1.41);
  // Headlights (L+R)
  [-.52,.52].forEach(sx=>{
    mesh(g,new THREE.BoxGeometry(.26,.12,.06),LM,sx,.4,1.38);
    mesh(g,new THREE.BoxGeometry(.24,.035,.04),LM,sx,.36,1.4);
  });
  // Taillights
  [-.54,.54].forEach(sx=>mesh(g,new THREE.BoxGeometry(.26,.12,.05),RL,sx,.4,-1.37));
  // Door handles
  [-.72,.72].forEach(sx=>{
    mesh(g,new THREE.BoxGeometry(.04,.06,.22),WM,sx,.55,-.1);
  });
  // Wheels
  const WG=new THREE.CylinderGeometry(.27,.27,.21,18);
  const RG=new THREE.CylinderGeometry(.17,.17,.23,12);
  [[-0.72,.88],[-0.72,-.88],[0.72,.88],[0.72,-.88]].forEach(([wx,wz])=>{
    const w=new THREE.Mesh(WG,TM); w.rotation.z=Math.PI/2; w.position.set(wx,.27,wz); w.castShadow=true; g.add(w);

// ─── Raycasting ───────────────────────────────────────
const raycaster=new THREE.Raycaster(), mouse=new THREE.Vector2();
const spotMeshes=spots.map(s=>s.mesh);

function getSpot(e){
  const r=renderer.domElement.getBoundingClientRect();
  mouse.x=((e.clientX-r.left)/r.width)*2-1;
  mouse.y=-((e.clientY-r.top)/r.height)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const h=raycaster.intersectObjects(spotMeshes);
  return h.length?spotMeshMap.get(h[0].object.uuid)||null:null;
}

// ─── Selection ────────────────────────────────────────
function selectSpot(s){
  if(selectedSpot&&selectedSpot!==s){selectedSpot.selected=false;refreshSpot(selectedSpot);}
  if(selectedSpot===s){s.selected=false;refreshSpot(s);selectedSpot=null;closePanel();return;}
  s.selected=true;refreshSpot(s);selectedSpot=s;openPanel(s);focusCamera(s);
}
function deselect(){
  if(!selectedSpot)return;
  selectedSpot.selected=false;refreshSpot(selectedSpot);selectedSpot=null;closePanel();
}

// ─── Camera Focus ─────────────────────────────────────
let camTgt=null;
function focusCamera(s){
  camTgt={pos:new THREE.Vector3(s.x,17,s.z+13),lookAt:new THREE.Vector3(s.x,0,s.z),t:0,sp:camera.position.clone(),sl:controls.target.clone()};
}
function tickCam(){
  if(!camTgt)return;
  camTgt.t=Math.min(camTgt.t+.022,1);
  const e=1-Math.pow(1-camTgt.t,3);
  camera.position.lerpVectors(camTgt.sp,camTgt.pos,e);
  controls.target.lerpVectors(camTgt.sl,camTgt.lookAt,e);
  if(camTgt.t>=1)camTgt=null;
}

// Status colors from React backend
const STATUS_COLORS = {
  free:     0x22c55e,
  reserved: 0xfacc15,
  occupied: 0xef4444,
};

// Receive spot data from React (polling updates)
window.addEventListener('message', (e) => {
  if (e.data?.type === 'UPDATE_SPOTS') {
    e.data.spots.forEach(apiSpot => {
      // Find matching spot by label (e.g. "A1", "B3")
      const localSpot = spots.find(s => s.id === apiSpot.label);
      if (!localSpot) return;

      const wasOccupied = localSpot.occupied;
      const isNowOccupied = apiSpot.status === 'occupied' || apiSpot.status === 'reserved';

      localSpot.occupied = isNowOccupied;

      // Spawn car if newly occupied
      if (!wasOccupied && isNowOccupied && !localSpot.car) {
        const car = makeCar();
        car.position.set(localSpot.x, .04, localSpot.z);
        if (localSpot.row === 'B') car.rotation.y = Math.PI;
        car.rotation.y += (Math.random() - .5) * .1;
        scene.add(car);
        localSpot.car = car;
      }
      // Remove car if now free
      if (wasOccupied && !isNowOccupied && localSpot.car) {
        scene.remove(localSpot.car);
        localSpot.car = null;
      }

      // Refresh mesh color
      if (!localSpot.selected) refreshSpot(localSpot);
    });
    updateStats();
  }
});

// Notify React that the model is ready (hide loading spinner)
window.parent.postMessage({ type: 'MODEL_READY' }, '*');

// Override click handler to send spot label back to React
// (overrides the local selectSpot for reservation — React handles that)
renderer.domElement.removeEventListener('click', renderer.domElement._clickHandler);
renderer.domElement.addEventListener('click', e => {
  const s = getSpot(e);
  if (!s) { deselect(); return; }
  if (s.occupied) { showTip(s, e.clientX, e.clientY); setTimeout(hideTip, 2200); return; }
  // Send label to React parent — React opens ReservationModal
  window.parent.postMessage({ type: 'SPOT_CLICKED', label: s.id }, '*');
  // Also do local highlight
  selectSpot(s);
});
</script>
</body>
</html>
