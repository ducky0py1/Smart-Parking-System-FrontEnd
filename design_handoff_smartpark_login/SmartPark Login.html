<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SmartPark — Connecter le portefeuille</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#07060b;
    --ink:#f4f1fb;
    --muted:#9a93ad;
    --faint:#6a6480;
    --line:rgba(255,255,255,0.10);
    --accent:#ff6a1d;
    --accent-2:#b14dff;
    --glow:0.6;
    --panel-w:430px;
    --font-disp:'Space Grotesk', system-ui, sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-disp);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  #root,.stage{height:100%;}
  .stage{position:relative;width:100%;height:100%;overflow:hidden;}

  /* ---------- VIDEO BACKGROUND LAYER ---------- */
  .video-layer{position:absolute;inset:0;z-index:0;overflow:hidden;}
  .bg-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .video-placeholder{position:absolute;inset:0;background:
      radial-gradient(120% 90% at 50% -10%, #16101f 0%, #0a0810 55%, #050409 100%);}
  .vp-grad{position:absolute;border-radius:50%;filter:blur(70px);opacity:calc(0.5 + var(--glow)*0.4);mix-blend-mode:screen;}
  .vp-grad-a{width:55vw;height:55vw;left:-10vw;top:-12vw;background:radial-gradient(circle,var(--accent),transparent 65%);animation:drift1 26s ease-in-out infinite;}
  .vp-grad-b{width:50vw;height:50vw;right:-12vw;bottom:-16vw;background:radial-gradient(circle,var(--accent-2),transparent 65%);animation:drift2 32s ease-in-out infinite;}
  @keyframes drift1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(8vw,6vh) scale(1.12);}}
  @keyframes drift2{0%,100%{transform:translate(0,0) scale(1.05);}50%{transform:translate(-7vw,-5vh) scale(0.95);}}
  .vp-grid{position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.045) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,0.045) 1px,transparent 1px);
    background-size:54px 54px;
    -webkit-mask-image:radial-gradient(120% 100% at 50% 40%,#000 30%,transparent 80%);
    mask-image:radial-gradient(120% 100% at 50% 40%,#000 30%,transparent 80%);
    transform:perspective(600px) rotateX(58deg) scale(2.2);
    transform-origin:50% 100%;
    animation:gridflow 18s linear infinite;opacity:0.7;}
  @keyframes gridflow{from{background-position:0 0;}to{background-position:0 54px;}}
  .vp-scan{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(0,0,0,0.18) 3px 4px);opacity:0.35;mix-blend-mode:multiply;}
  .vp-particles span{position:absolute;border-radius:50%;opacity:0;box-shadow:0 0 8px currentColor;animation:float linear infinite;}
  @keyframes float{0%{opacity:0;transform:translateY(20px);}10%{opacity:.9;}90%{opacity:.9;}100%{opacity:0;transform:translateY(-90px);}}
  .video-overlay{position:absolute;inset:0;background:
      radial-gradient(80% 70% at 50% 50%,transparent 0%,rgba(5,4,9,0.55) 70%,rgba(5,4,9,0.85) 100%),
      linear-gradient(180deg,rgba(5,4,9,0.45),rgba(5,4,9,0.1) 30%,rgba(5,4,9,0.6));}

  .video-badge{position:absolute;left:20px;top:18px;z-index:6;display:flex;align-items:center;gap:8px;
    font-family:var(--font-mono);font-size:11px;letter-spacing:0.04em;color:var(--muted);
    background:rgba(10,8,16,0.55);border:1px solid var(--line);padding:7px 11px;border-radius:6px;
    backdrop-filter:blur(8px);white-space:nowrap;}
  .video-badge code{color:var(--accent);background:rgba(255,255,255,0.06);padding:1px 5px;border-radius:4px;}
  .vb-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:blink 1.6s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.35;}}

  /* ---------- LAYOUT ---------- */
  .center{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:24px;}
  .page-foot{position:absolute;left:0;right:0;bottom:18px;z-index:5;display:flex;gap:10px;justify-content:center;
    font-family:var(--font-mono);font-size:11px;letter-spacing:0.06em;color:var(--faint);text-transform:uppercase;}
  .dot-sep{opacity:0.5;}

  /* ---------- PANEL (base / grid glass) ---------- */
  .panel{position:relative;width:var(--panel-w);max-width:100%;border-radius:6px;overflow:hidden;
    border:1px solid rgba(255,255,255,0.16);
    background:rgba(255,255,255,0.055);
    backdrop-filter:blur(22px) saturate(140%);
    -webkit-backdrop-filter:blur(22px) saturate(140%);
    box-shadow:
      0 30px 80px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.18);
    opacity:1;}
  @media (prefers-reduced-motion:no-preference){
    .panel{animation:rise .7s cubic-bezier(.2,.7,.2,1) both;}
  }
  /* Resting state is fully visible; entrance only nudges transform so a frozen
     frame (background tab / capture) still shows readable content. */
  @keyframes rise{from{transform:translateY(14px) scale(.985);}to{transform:none;}}
  .panel-tex{position:absolute;inset:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,0.07) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,0.07) 1px,transparent 1px);
    background-size:34px 34px;
    -webkit-mask-image:radial-gradient(130% 120% at 50% 0%,#000 40%,transparent 92%);
    mask-image:radial-gradient(130% 120% at 50% 0%,#000 40%,transparent 92%);}
  .panel-glow{position:absolute;inset:-1px;pointer-events:none;border-radius:inherit;
    background:linear-gradient(135deg,var(--accent),transparent 35%,transparent 65%,var(--accent-2));
    opacity:calc(0.16 + var(--glow)*0.26);mix-blend-mode:screen;}
  .panel::after{content:"";position:absolute;left:0;right:0;top:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--accent),var(--accent-2),transparent);
    opacity:calc(0.4 + var(--glow)*0.5);}
  .panel-inner{position:relative;z-index:2;padding:30px 30px 26px;}

  /* brand */
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-logo{width:48px;height:48px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;
    border:1px dashed rgba(255,255,255,0.28);background:rgba(255,255,255,0.04);}
  .brand-logo-tag{font-family:var(--font-mono);font-size:10px;letter-spacing:0.12em;color:var(--faint);}
  .brand-text{min-width:0;}
  .brand-name{margin:0;font-size:24px;font-weight:700;letter-spacing:-0.02em;line-height:1;}
  .brand-kicker{margin:5px 0 0;font-family:var(--font-mono);font-size:11px;letter-spacing:0.06em;color:var(--muted);text-transform:uppercase;}
  .rule{height:1px;background:var(--line);margin:22px 0;}

  .lead{margin-bottom:18px;}
  .lead-title{margin:0;font-size:17px;font-weight:600;letter-spacing:-0.01em;}
  .lead-title.is-centered{text-align:center;}
  .lead-sub{margin:6px 0 0;font-size:13.5px;line-height:1.5;color:var(--muted);}

  /* buttons */
  .btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;
    font-family:var(--font-disp);font-size:15px;font-weight:600;letter-spacing:-0.01em;
    padding:14px 18px;border-radius:6px;border:1px solid transparent;transition:transform .12s ease,box-shadow .2s ease,background .2s ease,filter .2s;}
  .btn:active{transform:translateY(1px);}
  .btn-primary{color:#1a0d04;border:none;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 10px 30px color-mix(in oklab,var(--accent) 45%,transparent),
               inset 0 1px 0 rgba(255,255,255,0.35);}
  .btn-primary:hover{filter:brightness(1.06);box-shadow:0 14px 38px color-mix(in oklab,var(--accent) 60%,transparent);}
  .btn-primary.is-busy{filter:saturate(.7) brightness(.95);cursor:default;}
  .btn-primary:disabled{cursor:default;}
  .btn-ghost{margin-top:10px;background:transparent;color:var(--muted);border:1px solid var(--line);}
  .btn-ghost:hover{color:var(--ink);border-color:rgba(255,255,255,0.28);}
  .wallet-mark{color:#1a0d04;}
  .arrow{font-size:17px;}

  .spinner{width:17px;height:17px;border-radius:50%;border:2px solid rgba(26,13,4,0.35);border-top-color:#1a0d04;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* steps */
  .steps{display:flex;align-items:center;gap:10px;margin-top:16px;justify-content:center;}
  .steps-line{flex:0 0 28px;height:1px;background:var(--line);}
  .step{display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:11px;color:var(--faint);}
  .step-n{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-size:10px;}
  .step.active{color:var(--ink);}
  .step.active .step-n{border-color:var(--accent);color:var(--accent);box-shadow:0 0 10px color-mix(in oklab,var(--accent) 60%,transparent);}
  .step.done{color:var(--muted);}
  .step.done .step-n{border-color:var(--accent-2);color:var(--accent-2);}

  /* guiding note */
  .note{margin:18px auto 0;max-width:340px;text-align:center;font-size:12.5px;line-height:1.6;color:var(--muted);
    padding:13px 15px;border-radius:6px;border:1px solid var(--line);background:rgba(255,255,255,0.035);}
  .alt{margin:16px 0 0;text-align:center;font-size:12.5px;color:var(--faint);}
  .link{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in oklab,var(--accent) 45%,transparent);}
  .link:hover{color:var(--accent-2);border-color:var(--accent-2);}

  /* connected state */
  .connected{display:flex;flex-direction:column;align-items:center;text-align:center;}
  .ok-ring{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;margin-bottom:14px;
    border:1.5px solid var(--accent);box-shadow:0 0 24px color-mix(in oklab,var(--accent) 55%,transparent);opacity:1;}
  @media (prefers-reduced-motion:no-preference){
    .ok-ring{animation:pop .45s cubic-bezier(.2,1.3,.4,1) both;}
  }
  @keyframes pop{from{transform:scale(.6);}to{transform:none;}}
  .ok-check{width:18px;height:9px;border-left:2.5px solid var(--accent);border-bottom:2.5px solid var(--accent);transform:rotate(-45deg) translateY(-2px);}
  .acct{display:flex;align-items:center;gap:10px;margin-top:16px;cursor:pointer;width:100%;
    padding:11px 13px;border-radius:6px;border:1px solid var(--line);background:rgba(255,255,255,0.04);transition:border-color .2s;}
  .acct:hover{border-color:rgba(255,255,255,0.25);}
  .acct-avatar{width:24px;height:24px;border-radius:50%;flex:0 0 auto;background:conic-gradient(from 90deg,var(--accent),var(--accent-2),var(--accent));}
  .acct-addr{font-family:var(--font-mono);font-size:13px;letter-spacing:0.02em;flex:1;text-align:left;}
  .acct-copy{font-family:var(--font-mono);font-size:11px;color:var(--accent);}
  .meta-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0 20px;}
  .chip{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;color:var(--muted);
    padding:5px 10px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,0.03);}
  .chip-dot{width:6px;height:6px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 8px var(--accent-2);}

  /* ---------- VARIANT: HOLO ---------- */
  .panel-holo{border-radius:18px;background:rgba(20,12,30,0.4);
    border:1px solid transparent;
    box-shadow:0 30px 90px rgba(0,0,0,0.6),
      0 0 0 1px rgba(255,255,255,0.06),
      0 0 60px color-mix(in oklab,var(--accent-2) calc(var(--glow)*30%),transparent);}
  .panel-holo .panel-glow{opacity:calc(0.3 + var(--glow)*0.4);
    background:conic-gradient(from 0deg,var(--accent),var(--accent-2),var(--accent),var(--accent-2),var(--accent));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:1.5px;border-radius:inherit;animation:spinhue 8s linear infinite;}
  @keyframes spinhue{to{transform:rotate(360deg);}}
  .panel-holo::after{display:none;}
  .panel-holo .note{border-radius:12px;}
  .panel-holo .btn{border-radius:12px;}
  .panel-holo .brand-logo{border-radius:12px;}

  /* ---------- VARIANT: TERMINAL ---------- */
  .panel-terminal{border-radius:0;background:rgba(6,5,10,0.82);border:1px solid var(--accent);
    box-shadow:0 0 0 1px rgba(0,0,0,0.6),0 30px 80px rgba(0,0,0,0.6),
      inset 0 0 40px color-mix(in oklab,var(--accent) calc(var(--glow)*14%),transparent);
    backdrop-filter:blur(6px);}
  .panel-terminal::after{height:2px;opacity:1;}
  .panel-terminal .panel-tex{background-size:0;}
  .panel-terminal .panel-inner{padding-top:34px;}
  .panel-terminal .panel-inner::before{content:"smartpark@web3 ~ % connect";position:absolute;top:-22px;left:2px;
    font-family:var(--font-mono);font-size:11px;color:var(--accent);letter-spacing:0.02em;}
  .panel-terminal .brand-name{font-family:var(--font-mono);font-size:20px;}
  .panel-terminal .brand-name::after{content:"_";color:var(--accent);animation:blink 1s steps(1) infinite;}
  .panel-terminal .lead-title,.panel-terminal .lead-sub,.panel-terminal .note,.panel-terminal .alt{font-family:var(--font-mono);}
  .panel-terminal .lead-title{font-size:14px;}
  .panel-terminal .lead-title::before{content:"> ";color:var(--accent);}
  .panel-terminal .btn{border-radius:0;font-family:var(--font-mono);}
  .panel-terminal .btn-primary{background:var(--accent);color:#0a0510;}
  .panel-terminal .note{border-radius:0;border-style:dashed;}
  .panel-terminal .brand-logo{border-radius:0;}
  .panel-terminal .acct,.panel-terminal .chip{border-radius:0;}

  /* ---------- responsive ---------- */
  @media (max-width:520px){
    :root{--panel-w:100%;}
    .panel-inner{padding:24px 20px 22px;}
    .video-badge{font-size:10px;left:12px;top:12px;}
    .brand-name{font-size:22px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;}
  }
</style>

</head>
